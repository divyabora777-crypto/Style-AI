<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
background:linear-gradient(45deg,#ff416c,#ff4b2b,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:gradient 10s ease infinite;
text-align:center;
font-family:sans-serif;
color:white;
}
@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.box{
margin-top:120px;
}
input{
padding:10px;
margin:10px;
border-radius:8px;
border:none;
}
button{
padding:10px 25px;
background:yellow;
border:none;
border-radius:20px;
cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
<h2>✨ StyleAI Login ✨</h2>
<form method="POST">
<input name="username" placeholder="Username" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button>Login 🚀</button>
</form>
<p>{{ error }}</p>
<a href="/register" style="color:white;">New User? Register ❤️</a>
</div>
</body>
</html>
