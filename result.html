<!DOCTYPE html>
<html>
<head>
<title>Result</title>
<style>
body{
background:linear-gradient(-45deg,#ff6a00,#ee0979,#43e97b,#38f9d7);
background-size:400% 400%;
animation:gradient 10s ease infinite;
text-align:center;
color:white;
font-family:sans-serif;
}
@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
img{
width:350px;
border-radius:20px;
animation:float 3s ease-in-out infinite;
}
@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}
</style>
</head>
<body>

<h1>🔥 Your Styled Look 👗✨</h1>

<img src="/static/{{ result_image }}">

<br><br>
<a href="/dashboard" style="color:white;">Try Another 🔁</a>

</body>
</html>
