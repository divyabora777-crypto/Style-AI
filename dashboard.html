<!DOCTYPE html>
<html>
<head>
<title>StyleAI</title>
<style>
body{
background:linear-gradient(-45deg,#ff416c,#ff4b2b,#f093fb,#43e97b,#38f9d7);
background-size:400% 400%;
animation:gradient 10s ease infinite;
text-align:center;
font-family:sans-serif;
color:white;
}
@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
img{
width:150px;
border-radius:15px;
margin:10px;
cursor:pointer;
}
button{
padding:10px 20px;
border:none;
border-radius:20px;
background:yellow;
cursor:pointer;
}
</style>
</head>
<body>

<h1>👗 Choose Your Outfit 🔥</h1>

<form action="/style" method="POST" enctype="multipart/form-data">

<input type="file" name="photo" required><br><br>

<label>
<input type="radio" name="dress" value="dress1.png" required>
<img src="/static/dresses/dress1.png">
</label>

<label>
<input type="radio" name="dress" value="dress2.png">
<img src="/static/dresses/dress2.png">
</label>

<label>
<input type="radio" name="dress" value="dress3.png">
<img src="/static/dresses/dress3.png">
</label>

<br><br>
<button>Apply Style ✨</button>

</form>

<br>
<a href="/logout" style="color:white;">Logout 🚪</a>

</body>
</html>
